<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNDER CONSTRUCTION!!!!</title>
  <style>
    /* Reset margins and ensure full document height */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden; /* Prevents unwanted horizontal scrolling */
    }

    /* Container for the full-screen background image */
    .fullscreen-bg {
      background-image: url('VERY COOL WEBSITE.png'); /* Replace with your image link */
      height: 100vh;
      width: 100vw;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      
      /* Optional: Centers text content inside the image container */
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- The full screen section -->
  <div class="fullscreen-bg">

  </div>

</body>
</html>
